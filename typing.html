<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Real-Time Velocity Typing Engine</title>

<style>
:root {
  --accent: #00eaff;
  --bg: #020617;
  --panel: #060b1e;
  --muted: #7c83a1;
  --bad: #ff4d4d;
}

* {
  box-sizing: border-box;
  font-family: "JetBrains Mono", monospace;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,234,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,234,255,0.04) 1px, transparent 1px),
    radial-gradient(circle at top, #0b102b, #020617);
  background-size: 50px 50px, 50px 50px, cover;
  animation: gridMove 30s linear infinite;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  overflow: hidden;
}

@keyframes gridMove {
  to { background-position: 50px 50px, 50px 50px; }
}

/* BACKGROUND HUD LINES */
.bg-effects {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
}

.bg-effects span {
  position: absolute;
  width: 2px;
  height: 120px;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(0,234,255,0.4),
    transparent
  );
  animation: float 16s linear infinite;
}

.bg-effects span:nth-child(1) { left: 10%; animation-duration: 18s; }
.bg-effects span:nth-child(2) { left: 25%; animation-duration: 12s; }
.bg-effects span:nth-child(3) { left: 40%; animation-duration: 20s; }
.bg-effects span:nth-child(4) { left: 60%; animation-duration: 14s; }
.bg-effects span:nth-child(5) { left: 75%; animation-duration: 22s; }
.bg-effects span:nth-child(6) { left: 90%; animation-duration: 16s; }

@keyframes float {
  from { transform: translateY(120vh); }
  to { transform: translateY(-150px); }
}

/* CONTAINER */
.container {
  width: 980px;
  background: linear-gradient(180deg, #05091a, #020413);
  padding: 34px;
  border-radius: 20px;
  box-shadow: 0 0 60px rgba(0,234,255,0.35);
}

/* TITLE */
.title {
  text-align: center;
  font-size: 28px;
  margin-bottom: 24px;
  letter-spacing: 2px;
  color: var(--accent);
  text-shadow: 0 0 18px rgba(0,234,255,0.6);
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 22px;
}

.metric {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}

.metric span {
  display: block;
  font-size: 26px;
  color: var(--accent);
}

/* TEXT AREA */
#text-area {
  background: var(--panel);
  padding: 30px;
  border-radius: 16px;
  font-size: 22px;
  line-height: 1.7;
  min-height: 220px;
}

#text-area.velocity {
  animation: glow 0.9s infinite;
}

@keyframes glow {
  50% { box-shadow: 0 0 40px rgba(0,234,255,0.9); }
}

.char { color: var(--muted); }
.char.correct { color: white; }
.char.incorrect { color: var(--bad); text-decoration: underline; }
.char.active { border-left: 2px solid var(--accent); }

/* RESULT POPUP */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(2,6,23,0.95);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.popup {
  background: #05091a;
  padding: 36px 44px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 0 50px rgba(0,234,255,0.6);
}

.popup h2 {
  color: var(--accent);
  margin-bottom: 20px;
}

.popup p {
  font-size: 18px;
  margin: 10px 0;
}

.popup button {
  margin-top: 24px;
  padding: 10px 28px;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  border-radius: 10px;
  font-size: 16px;
}

.popup button:hover {
  background: var(--accent);
  color: #020617;
}
</style>
</head>

<body>

<div class="bg-effects">
  <span></span><span></span><span></span>
  <span></span><span></span><span></span>
</div>

<div class="container">
  <div class="title">The Real-Time Velocity Typing Engine</div>

  <div class="header">
    <div class="metric">WPM<span id="wpm">0</span></div>
    <div class="metric">ACCURACY<span id="acc">100%</span></div>
    <div class="metric">TIME<span id="time">60</span></div>
  </div>

  <div id="text-area"></div>
</div>

<div id="overlay">
  <div class="popup">
    <h2>Time's Up</h2>
    <p>WPM: <span id="fwpm"></span></p>
    <p>Accuracy: <span id="facc"></span></p>
    <button id="restart">Restart</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

/* ---------- UNLIMITED NON-REPEATING TEXT ENGINE ---------- */

const WORD_BANK = [
  "typing","speed","accuracy","system","engine","real","time","focus","performance",
  "memory","keyboard","reaction","precision","control","flow","practice","challenge",
  "pressure","consistency","discipline","momentum","signal","process","latency",
  "buffer","event","thread","logic","input","output","feedback","stability",
  "efficiency","runtime","sequence","pattern","context","response","adaptive",
  "dynamic","state","benchmark","optimize","predict","execute","sustain",
  "balance","neural","cognitive","reflex","stream","pipeline","metrics","evaluation"
];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

shuffle(WORD_BANK);
let wordIndex = 0;

function generateChunk(count = 35) {
  let text = "";
  for (let i = 0; i < count; i++) {
    if (wordIndex >= WORD_BANK.length) {
      shuffle(WORD_BANK);
      wordIndex = 0;
    }
    let w = WORD_BANK[wordIndex++];
    if (i === 0) w = w[0].toUpperCase() + w.slice(1);
    text += w + " ";
  }
  return text;
}

/* ---------- CORE ENGINE ---------- */

const area = document.getElementById("text-area");
const wpmEl = document.getElementById("wpm");
const accEl = document.getElementById("acc");
const timeEl = document.getElementById("time");
const overlay = document.getElementById("overlay");
const fwpm = document.getElementById("fwpm");
const facc = document.getElementById("facc");

let chars = [];
let index = 0;
let correct = 0;
let total = 0;
let start = null;
let running = true;

/* APPEND TEXT */
function appendText() {
  const text = generateChunk();
  [...text].forEach(c => {
    const s = document.createElement("span");
    s.textContent = c;
    s.className = "char";
    area.appendChild(s);
    chars.push(s);
  });
  chars[index]?.classList.add("active");
}

appendText();

/* TIMER */
function startTimer() {
  const begin = performance.now();
  function tick(now) {
    const left = Math.max(0, 60 - (now - begin) / 1000);
    timeEl.textContent = Math.ceil(left);
    if (left > 0) requestAnimationFrame(tick);
    else finish();
  }
  requestAnimationFrame(tick);
}

/* INPUT HANDLER */
document.addEventListener("keydown", e => {
  if (!running) return;

  if (!start) {
    start = performance.now();
    startTimer();
  }

  const cur = chars[index];
  if (!cur) return;

  if (e.key === "Backspace") {
    if (index > 0) {
      cur.classList.remove("active");
      index--;
      if (chars[index].classList.contains("correct")) correct--;
      chars[index].className = "char active";
    }
    return;
  }

  if (e.key.length !== 1) return;

  total++;
  cur.classList.remove("active");

  if (e.key === cur.textContent) {
    cur.classList.add("correct");
    correct++;
  } else {
    cur.classList.add("incorrect");
  }

  index++;
  if (index > chars.length * 0.7) appendText();
  chars[index]?.classList.add("active");

  const mins = (performance.now() - start) / 60000;
  const wpm = Math.round(((correct / 5) / mins) || 0);
  const acc = Math.round((correct / total) * 100);

  wpmEl.textContent = wpm;
  accEl.textContent = acc + "%";
  area.classList.toggle("velocity", wpm > 80);
});

/* FINISH */
function finish() {
  running = false;
  fwpm.textContent = wpmEl.textContent;
  facc.textContent = accEl.textContent;
  overlay.style.display = "flex";
}

document.getElementById("restart").onclick = () => location.reload();

});
</script>

</body>
</html>
